
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi-kontroll</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background"></div>
  <h1>Raspberry Pi-kontroll</h1>

  <p>
    Brygga: <input id="url" size="28">
    <button onclick="connect()">Anslut</button>
    <span id="status" class="off">● Ej ansluten</span>
  </p>

  <p>
    <button onclick="send('LED ON')">LED på</button>
    <button onclick="send('LED OFF')">LED av</button>
    <button onclick="send('STATUS')">Status</button>
    <button onclick="send('PING')">Ping</button>
    <button onclick="send('TIME')">Tid</button>
  </p>

  <p>
    <input id="msg" placeholder="Eget kommando..." size="28">
    <button onclick="send(document.getElementById('msg').value)">Skicka</button>
  </p>

  <div id="log"></div>
  <svg viewBox="0 0 520 340">
    
  <g class="roads">
    <line class="road" data-from="A" data-to="B" x1="90"  y1="60"  x2="260" y2="60"/>
    <line class="road" data-from="B" data-to="C" x1="260" y1="60"  x2="430" y2="60"/>
    <line class="road" data-from="A" data-to="D" x1="90"  y1="60"  x2="90"  y2="170"/>

    <line class="road" data-from="E" data-to="F" x1="260" y1="170" x2="430" y2="170"/>

    <line class="road" data-from="G" data-to="H" x1="90"  y1="280" x2="260" y2="280"/>
    <line class="road" data-from="H" data-to="I" x1="260" y1="280" x2="430" y2="280"/>

</svg>
