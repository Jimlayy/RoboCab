
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi-kontroll</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Raspberry Pi-kontroll</h1>

  <p>
    Brygga: <input id="url" size="28">
    <button onclick="connect()">Anslut</button>
    <span id="status" class="off">● Ej ansluten</span>
  </p>

  <p>
    <button onclick="send('LED ON')">LED på</button>
    <button onclick="send('LED OFF')">LED av</button>
    <button onclick="send('STATUS')">Status</button>
    <button onclick="send('PING')">Ping</button>
    <button onclick="send('TIME')">Tid</button>
  </p>

  <p>
    <input id="msg" placeholder="Eget kommando..." size="28">
    <button onclick="send(document.getElementById('msg').value)">Skicka</button>
  </p>

  <div id="log"></div>
  <svg viewBox="0 0 520 340">
    
  <g class="roads">
    <line class="road" data-from="A" data-to="B" x1="90"  y1="60"  x2="260" y2="60"/>
    <line class="road" data-from="B" data-to="C" x1="260" y1="60"  x2="430" y2="60"/>
    <line class="road" data-from="A" data-to="D" x1="90"  y1="60"  x2="90"  y2="170"/>
    <line class="road" data-from="C" data-to="F" x1="430" y1="60"  x2="430" y2="170"/>
    <line class="road" data-from="D" data-to="E" x1="90"  y1="170" x2="260" y2="170"/>
    <line class="road" data-from="E" data-to="F" x1="260" y1="170" x2="430" y2="170"/>
    <line class="road" data-from="D" data-to="G" x1="90"  y1="170" x2="90"  y2="280"/>
    <line class="road" data-from="E" data-to="H" x1="260" y1="170" x2="260" y2="280"/>
    <line class="road" data-from="F" data-to="I" x1="430" y1="170" x2="430" y2="280"/>
    <line class="road" data-from="G" data-to="H" x1="90"  y1="280" x2="260" y2="280"/>
    <line class="road" data-from="H" data-to="I" x1="260" y1="280" x2="430" y2="280"/>
  </g>

  <g class="node" data-id="A">
    <circle cx="90" cy="60" r="29"/>
    <text x="90" y="66">A</text>
  </g>
  <g class="node" data-id="B">
    <circle cx="260" cy="60" r="29"/>
    <text x="260" y="66">B</text>
  </g>
  <g class="node" data-id="C">
    <circle cx="430" cy="60" r="29"/>
    <text x="430" y="66">C</text>
  </g>
  <g class="node" data-id="D">
    <circle cx="90" cy="170" r="29"/>
    <text x="90" y="176">D</text>
  </g>
  <g class="node" data-id="E">
    <circle cx="260" cy="170" r="29"/>
    <text x="260" y="176">E</text>
  </g>
  <g class="node" data-id="F">
    <circle cx="430" cy="170" r="29"/>
    <text x="430" y="176">F</text>
  </g>
  <g class="node" data-id="G">
    <circle cx="90" cy="280" r="29"/>
    <text x="90" y="286">G</text>
  </g>
  <g class="node" data-id="H">
    <circle cx="260" cy="280" r="29"/>
    <text x="260" y="286">H</text>
  </g>
  <g class="node" data-id="I">
    <circle cx="430" cy="280" r="29"/>
    <text x="430" y="286">I</text>
  </g>
</svg>
  <!-- Laddas sist så att alla element ovanför redan finns när skriptet körs -->
  <script src="script.js"></script>
</body>
</html>
