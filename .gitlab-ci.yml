image: debian:bookworm-slim

stages: [build, test]

before_script:
  - apt-get update -qq
  - apt-get install -y -qq make

build-avr:
  stage: build
  script:
    - apt-get install -y -qq gcc-avr avr-libc
    - make avr

camera-tests:
  stage: test
  script:
    - apt-get install -y -qq python3-opencv python3-pytest
    - make camera-test

c-tests:
  stage: test
  script:
    - apt-get install -y -qq gcc libc6-dev
    - make c-test